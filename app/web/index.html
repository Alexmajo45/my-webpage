<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Today – Cortex</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="shell">
    <nav class="nav" aria-label="Main">
      <a class="logo" href="#/today" aria-label="Cortex, go to Today"><span class="mark" aria-hidden="true"></span><span class="logo-text">Cortex</span></a>
      <div class="nav-links">
        <a href="#/today" data-view="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
          <span>Today</span></a>
        <a href="#/plan" data-view="plan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.3 1.3L7 5M3.5 12l1.3 1.3L7 11M3.5 18l1.3 1.3L7 17"/></svg>
          <span>Plan</span></a>
        <a href="#/money" data-view="money">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="m7 15 4-4 3 3 5-6"/></svg>
          <span>Money</span></a>
        <a href="#/saved" data-view="saved">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
          <span>Saved</span></a>
        <a href="#/ask" data-view="ask">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
          <span>Ask</span></a>
      </div>
      <a class="nav-settings" href="#/settings" data-view="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
        <span>Settings</span></a>
    </nav>

    <main id="view" tabindex="-1"><p class="muted">Loading…</p></main>
  </div>

  <dialog id="holding-dialog" aria-labelledby="holding-title">
    <form id="holding-form" method="dialog">
      <h2 id="holding-title">Add a holding</h2>
      <p class="muted" id="holding-help">Enter what you own. Cortex only tracks it; it never trades.</p>
      <div class="fields">
        <label>Ticker symbol<input name="symbol" required placeholder="e.g. VWCE.DE…" autocomplete="off" spellcheck="false"></label>
        <label>Name<input name="name" placeholder="e.g. Vanguard All-World…" autocomplete="off"></label>
        <label>How many you own<input name="quantity" type="number" inputmode="decimal" step="any" min="0" value="0"><small>Enter 0 to just watch it.</small></label>
        <label>Price you paid, each<input name="costBasis" type="number" inputmode="decimal" step="any" min="0"></label>
        <label>Currency<input name="currency" required value="EUR" maxlength="3" autocomplete="off" spellcheck="false"></label>
        <label>Type
          <select name="assetClass">
            <option value="equity">Share</option><option value="etf">Fund (ETF)</option><option value="bond">Bond</option>
            <option value="crypto">Crypto</option><option value="cash">Cash</option><option value="other">Other</option>
          </select></label>
        <label class="wide">Words to watch for in the news<input name="keywords" placeholder="e.g. semiconductor, chip…" autocomplete="off"><small>Separate with commas. Headlines containing these are shown to you.</small></label>
      </div>
      <p class="form-error" id="holding-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn danger" id="holding-remove" hidden>Remove holding</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button class="btn primary" value="save">Save holding</button>
      </div>
    </form>
  </dialog>

  <dialog id="note-dialog" aria-labelledby="note-title">
    <form id="note-form" method="dialog">
      <h2 id="note-title">Why did you save this?</h2>
      <p class="muted">A line in your own words makes it findable later.</p>
      <label class="sr-only" for="note-text">Note</label>
      <textarea id="note-text" name="note" rows="3" placeholder="e.g. Opening exercise for the leadership workshop…"></textarea>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button type="button" class="btn" data-close>Cancel</button>
        <button class="btn primary" value="save">Save note</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
